[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkb"
version = "0.1.0"
description = "Personal Knowledge Base exporter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
search = [
  "jieba>=0.42.1",
]
mcp = [
  "mcp>=1.0",
]
douyin = [
  "funasr>=1.2",
  "faster-whisper>=1.1",
  "torch>=2.0",
  "torchaudio>=2.0",
]

[project.scripts]
pkb = "pkb.cli:main"

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"
pythonpath = ["src"]
testpaths = ["tests"]
